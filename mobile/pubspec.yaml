name: kasoro_mobile
description: "Kasoro — messagerie vocale multilingue pour l'Afrique de l'Ouest."
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Réseau
  dio: ^5.4.3

  # Routing déclaratif
  go_router: ^14.2.0

  # Stockage sécurisé du token JWT
  flutter_secure_storage: ^9.2.2

  # Enregistrement et lecture audio (messages vocaux)
  # `record` ^6.x tire un jeu de packages fédérés cohérents
  # (record_android/record_linux/record_platform_interface alignés) —
  # la 5.1.2 avait un conflit de versions entre record_platform_interface
  # et record_linux qui cassait la compilation (voir decisions-and-learnings).
  record: ^6.2.0
  just_audio: ^0.9.40
  path_provider: ^2.1.3

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
