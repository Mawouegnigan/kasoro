services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - kasoro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ../pipeline:/code/pipeline
      # Cache des modèles MMS (Hugging Face) : persiste entre redémarrages
      # du conteneur pour ne pas retélécharger un modèle déjà utilisé.
      - kasoro_hf_cache:/root/.cache/huggingface
      # Fichiers audio générés par le TTS
      - kasoro_audio:/code/storage/audio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  kasoro_pg_data:
  kasoro_hf_cache:
  kasoro_audio:
